databases:
  - name: roas-master-db
    databaseName: roas_master
    user: roas_master
    plan: free
services:
  - type: web
    name: roas-master-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: roas-master-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SETUP_KEY
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: API_PUBLIC_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://faizanxhustle-lab.github.io